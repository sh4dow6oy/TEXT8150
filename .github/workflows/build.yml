name: Build R5Q
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5
        with:
          repository: sh4dow6oy/TEXT8150
          ref: android16
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
            ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"
          
          # 5. Configurare
          make $MAKE_ARGS r5q_eur_open_defconfig
          ./scripts/config --file out/.config \
            -e CONFIG_LTO
          make $MAKE_ARGS olddefconfig
          
          # 6. Compilare
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-unknown-warning-option -Wno-unused-command-line-argument"

      - name: Package with AnyKernel3
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"
          RAW_IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"
          
          # Clonăm AnyKernel3 pentru ambalare
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git
          
          # Dacă Image.gz nu există, dar Image există, îl comprimăm noi cu gzip
          if [ ! -f "$IMAGE" ] && [ -f "$RAW_IMAGE" ]; then
            gzip -9nc "$RAW_IMAGE" > "$IMAGE"
          fi
          
          DTBO="$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img"
          
          # Copiem kernelul și DTBO în folderul AnyKernel
          cp $IMAGE AnyKernel3/Image.gz
          [ -f "$DTBO" ] && cp $DTBO AnyKernel3/dtbo.img
          
          # Configurăm anykernel.sh pentru S10 Lite (r5q)
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=SM-G770F/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=toro/device.name3=r5q/g' AnyKernel3/anykernel.sh
          
          # Creăm arhiva ZIP finală
          cd AnyKernel3
          zip -r9 ../Kernel-S10Lite-R5Q-Neutron.zip *
          
      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v5
        with:
          name: Kernel-S10Lite-R5Q
          path: Kernel-S10Lite-R5Q-Neutron.zip
